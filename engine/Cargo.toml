[package]
name = "spoterm-engine"
version = "0.1.0"
edition = "2021"
description = "SpoTerm's built-in Spotify Connect player (librespot), driven over stdin/stdout"
license = "MIT"
publish = false

[dependencies]
librespot-core = "=0.8.0"
librespot-connect = "=0.8.0"
librespot-metadata = "=0.8.0"
librespot-oauth = "=0.8.0"
librespot-playback = { version = "=0.8.0", default-features = false, features = ["native-tls", "rodio-backend"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"   # so a panicking audio backend is caught instead of killing playback
