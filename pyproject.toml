[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spoterm"
dynamic = ["version"]
description = "A minimal, keyboard-driven Spotify player for the terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ['windows-curses>=2.3; sys_platform == "win32"']

[project.scripts]
spoterm = "spoterm.__main__:run"

[tool.setuptools]
packages = ["spoterm"]

[tool.setuptools.dynamic]
version = { attr = "spoterm.__version__" }
